<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termik-forecast Danmark</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://unpkg.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛩️</text></svg>">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#2e7dc4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Termik">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="map"></div>

    <div id="sidebar">
        <div id="sidebar-toggle">&#9654;</div>
        <div class="sidebar-content">
        <h2>Filtrering</h2>
        <div id="day-buttons">
            <button class="day-btn active" data-day="0">I dag</button>
            <button class="day-btn" data-day="1">I morgen</button>
            <button class="day-btn" data-day="2">Overmorgen</button>
            <button class="day-btn" data-day="3">+3 dage</button>
            <button class="day-btn" data-day="4">+4 dage</button>
            <button class="day-btn" data-day="5">+5 dage</button>
            <button class="day-btn" data-day="6">+6 dage</button>
        </div>
        <div id="uncertainty-note" style="display:none;"></div>
        <div id="time-control">
            <input type="range" id="time-slider" min="6" max="21" value="14" step="1">
            <span id="time-display">14:00</span>
        </div>
        <div id="update-info"></div>

        <div id="favorite-section">
            <h2>Favorit-plads</h2>
            <select id="favorite-select">
                <option value="">Vælg flyveplads…</option>
            </select>
            <div id="favorite-forecast"></div>
        </div>

        <div id="layer-section">
            <h2>Kortlag</h2>
            <div class="layer-options">
                <label class="layer-option">
                    <input type="radio" name="map-layer" value="score" checked>
                    <span>Flyveforhold (score)</span>
                </label>
                <label class="layer-option">
                    <input type="radio" name="map-layer" value="thermal-top">
                    <span>Termik-tophøjde</span>
                </label>
            </div>
            <div id="layer-legend"></div>
        </div>

        <div id="about-link">
            <a href="om.html">Om denne side</a>
        </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
