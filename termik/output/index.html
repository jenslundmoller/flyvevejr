<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termik-forecast Danmark</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛩️</text></svg>">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#2e7dc4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Termik">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="map"></div>

    <div id="sidebar">
        <div id="sidebar-toggle">&#9654;</div>
        <div class="sidebar-content">
        <h2>Filtrering</h2>
        <div id="day-buttons">
            <button class="day-btn active" data-day="0">I dag</button>
            <button class="day-btn" data-day="1">I morgen</button>
            <button class="day-btn" data-day="2">Overmorgen</button>
            <button class="day-btn" data-day="3">+3 dage</button>
            <button class="day-btn" data-day="4">+4 dage</button>
            <button class="day-btn" data-day="5">+5 dage</button>
            <button class="day-btn" data-day="6">+6 dage</button>
        </div>
        <div id="uncertainty-note" style="display:none;"></div>
        <div id="time-control">
            <input type="range" id="time-slider" min="6" max="21" value="14" step="1">
            <span id="time-display">14:00</span>
        </div>
        <div id="update-info"></div>

        <div id="favorite-section">
            <h2>Favorit-plads</h2>
            <select id="favorite-select">
                <option value="">Vælg flyveplads…</option>
            </select>
            <div id="favorite-forecast"></div>
        </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () {});
            });
        }
    </script>
</body>
</html>
