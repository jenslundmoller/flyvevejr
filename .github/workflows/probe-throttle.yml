name: Probe Open-Meteo throttling

# Engangsmåling til punkt 13 i overdragelsen 2026-10-05: hvor længe holder
# Open-Meteo igen over for en GitHub-runner efter et vellykket kald? Startes
# manuelt lige efter at en update-forecast-kørsel er færdig (cron kl. :15
# hver 3. time), så de to ikke deler kvote og forurener hinanden. Med 3
# gentagelser tager proben ~65 min. Resultatet står som PROBE- og
# SUMMARY-linjer i loggen. Skriver intet til repoet.

on:
  workflow_dispatch:
    inputs:
      reps:
        description: 'Gentagelser pr. forsøgsarm'
        default: '3'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r termik/requirements.txt

      - name: Probe
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m termik.tools.probe_throttle "${{ inputs.reps }}"
