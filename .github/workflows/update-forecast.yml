name: Update Termik Forecast

on:
  schedule:
    # Run every 3 hours
    - cron: '15 */3 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    # Normale kørsler tager 7-25 min. Et vedvarende API-udfald koster nu
    # 105 s backoff plus op til 4 x 30 s timeout pr. batch, altså op mod
    # 100 min for alle 27 batches. Uden loft kunne en syg kørsel æde sig ind
    # i næste cron-slot 3 timer senere.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r termik/requirements.txt

      - name: Run forecast
        run: python -m termik

      - name: Commit and push updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add termik/output/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update termik forecast $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Kørslen tager ~20 min, så main kan være rykket siden checkout
            # (kode-pushes rammer ellers en push-race). Datacommits rører kun
            # termik/output/data/, så rebase oven på ny main er altid ren.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              git pull --rebase origin main
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run deploy-pages.yml --ref "$REF"; then
              echo "Deploy triggered on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "::error::Failed to trigger deploy after 3 attempts"
          exit 1
