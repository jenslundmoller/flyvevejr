name: Update Termik Forecast
# Titlen viser hvilken runner kørslen bad om; forecast-fallback.yml læser
# den, så den aldrig aflyser en reservekørsel.
run-name: Update Termik Forecast (${{ inputs.runner || 'self-hosted' }})

on:
  schedule:
    # Hver 3. time kl. 05-17 UTC (07-19 dansk sommertid): ingen kigger om
    # natten, men morgenkørslen kl. 05 giver en frisk prognose. 5 kørsler i
    # døgnet holder Open-Meteo-forbruget på ~5.400 af 10.000 gratis kald.
    - cron: '15 5-17/3 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      runner:
        description: 'self-hosted (maskinen derhjemme) eller ubuntu-latest (reserve)'
        default: 'self-hosted'
        type: choice
        options: [self-hosted, ubuntu-latest]

permissions:
  contents: write
  actions: write

jobs:
  update-forecast:
    # Selvhostet runner på OMV-maskinen derhjemme: Open-Meteo drosler GitHub-runnerne, så
    # halvdelen af kaldene hang 30 s derfra, mens intet hænger hjemmefra
    # (Referat 2026-09-02, opfølgning 5/10). Er maskinen nede, flytter
    # forecast-fallback.yml kørslen til ubuntu-latest.
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || fromJSON('["self-hosted", "flyvevejr"]') }}
    # Normale kørsler tager 7-25 min. Et vedvarende API-udfald koster nu
    # 105 s backoff plus op til 4 x 30 s timeout pr. batch, altså op mod
    # 100 min for alle 27 batches. Uden loft kunne en syg kørsel æde sig ind
    # i næste cron-slot 3 timer senere. 75 og ikke 60: 30/9 tog første forsøg
    # 40 min, og redningsrunden kan nu koste op til ~14 min oveni (180 s pause
    # + 5 batches x 3 forsøg).
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v5

      # Den selvhostede runner (OMV, Debian 13) bruger maskinens Python 3.13 i en
      # venv; testsuiten består på både 3.12 og 3.13.
      - name: Set up Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            python3 -m venv "$RUNNER_TEMP/venv"
            echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/venv/bin/pip" install -q -r termik/requirements.txt
          else
            pip install -r termik/requirements.txt
          fi

      - name: Run forecast
        # Ubufferet, så hver linje får sit eget tidsstempel i loggen. Ellers
        # lander hele outputtet med samme tid, når processen slutter.
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m termik

      - name: Commit and push updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add termik/output/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update termik forecast $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Kørslen tager ~20 min, så main kan være rykket siden checkout
            # (kode-pushes rammer ellers en push-race). Datacommits rører kun
            # termik/output/data/, så rebase oven på ny main er altid ren.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              git pull --rebase origin main
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        # Python i stedet for gh: den selvhostede runner på OMV har ikke gh.
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: python -m termik.tools.dispatch_workflow deploy-pages.yml
